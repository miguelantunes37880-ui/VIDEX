
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEX</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #181818;
  border-bottom: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 2px;
}

.logo span {
  color: #aaa;
}

main {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

h2 {
  font-size: 21px;
  margin-bottom: 20px;
}

.videos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.video {
  background: #1d1d1d;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s;
}

.video:active {
  transform: scale(.98);
}

.video img {
  width: 100%;
  display: block;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}

.info {
  padding: 14px;
}

.info h3 {
  font-size: 16px;
  margin: 0 0 9px;
}

.info p {
  color: #aaa;
  margin: 0;
  font-size: 13px;
}

#playerArea {
  display: none;
  margin-bottom: 30px;
}

#player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}

#player iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

#playerTitle {
  font-size: 18px;
  margin-top: 12px;
}

.back {
  margin: 0 0 12px;
  padding: 10px 16px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #292929;
  color: white;
  cursor: pointer;
}

footer {
  text-align: center;
  color: #777;
  padding: 30px 10px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="logo">VID<span>EX</span></div>
  <div>▶ Vídeos</div>
</header>

<main>

  <section id="playerArea">
    <button class="back" onclick="fecharVideo()">← Voltar</button>
    <div id="player"></div>
    <h3 id="playerTitle"></h3>
    <p style="color:#aaa">@Jazzghost</p>
  </section>

  <h2>Vídeos para assistir</h2>

  <section class="videos">

    <article class="video" onclick="assistir('J_vCoFgAkYA', 'MINECRAFT, MAS OS MOBS DROPAM')">
      <img
        src="https://i.ytimg.com/vi/J_vCoFgAkYA/hqdefault.jpg"
        alt="Capa do vídeo Minecraft, mas os mobs dropam"
      >
      <div class="info">
        <h3>MINECRAFT, MAS OS MOBS DROPAM</h3>
        <p>@Jazzghost</p>
      </div>
    </article>

    <article class="video" onclick="assistir('7xV2g8yAcUg', 'LITTLE NIGHTMARES 3 (Parte 1)')">
      <img
        src="https://i.ytimg.com/vi/7xV2g8yAcUg/hqdefault.jpg"
        alt="Capa do vídeo Little Nightmares 3"
      >
      <div class="info">
        <h3>LITTLE NIGHTMARES 3 (Parte 1)</h3>
        <p>@Jazzghost</p>
      </div>
    </article>

  </section>

</main>

<footer>
  VIDEX © 2026 — Seu mundo de vídeos.
</footer>

<script>
function assistir(id, titulo) {
  document.getElementById("playerArea").style.display = "block";
  document.getElementById("playerTitle").textContent = titulo;

  document.getElementById("player").innerHTML =
    '<iframe src="https://www.youtube.com/embed/' + id +
    '?playsinline=1" title="VIDEX Player" ' +
    'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
    'allowfullscreen></iframe>';

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function fecharVideo() {
  document.getElementById("player").innerHTML = "";
  document.getElementById("playerArea").style.display = "none";
}
</script>

</body>
  </html>
